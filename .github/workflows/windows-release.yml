name: Windows x64 package

on:
  push:
    tags:
      - 'stage1-windows-v*'
      - 'stage2-windows-v*'
      - 'stage3-windows-v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing Windows release tag
        required: true
        type: string

permissions:
  contents: read

env:
  ZIP_NAME: MovieReviewStudio-Windows-x64.zip
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
  REUSE_WINDOWS_MEDIA: ${{ startsWith(inputs.release_tag || github.ref_name, 'stage3-windows-v3.0.') || startsWith(inputs.release_tag || github.ref_name, 'stage3-windows-v3.1.') || (startsWith(inputs.release_tag || github.ref_name, 'stage3-windows-v3.3.') || startsWith(inputs.release_tag || github.ref_name, 'stage3-windows-v3.4.')) }}
  REUSE_LAME_MEDIA: ${{ (startsWith(inputs.release_tag || github.ref_name, 'stage3-windows-v3.3.') || startsWith(inputs.release_tag || github.ref_name, 'stage3-windows-v3.4.')) }}

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          [[ "$RELEASE_TAG" == stage1-windows-v* || "$RELEASE_TAG" == stage2-windows-v* || "$RELEASE_TAG" == stage3-windows-v* ]]
          git check-ref-format "refs/tags/$RELEASE_TAG"
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64

      - name: Smoke test the dependency-installing Windows launcher
        if: startsWith(env.RELEASE_TAG, 'stage2-') || startsWith(env.RELEASE_TAG, 'stage3-')
        timeout-minutes: 10
        run: |
          $marker = Join-Path $env:RUNNER_TEMP 'source launch ready.txt'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File packaging/launch-windows.ps1 -SmokeMarker $marker
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $marker)) {
            throw 'The source launcher failed to install dependencies and open the editor.'
          }

      - uses: msys2/setup-msys2@v2
        if: env.REUSE_WINDOWS_MEDIA == 'false'
        with:
          msystem: UCRT64
          install: >-
            git make diffutils
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-pkgconf

      - name: Build FFmpeg and FFprobe
        if: env.REUSE_WINDOWS_MEDIA == 'false'
        shell: msys2 {0}
        run: |
          if [[ "$RELEASE_TAG" == stage3-* ]]; then
            bash packaging/build-ffmpeg-windows.sh --with-lame
          else
            bash packaging/build-ffmpeg-windows.sh
          fi

      - name: Reuse verified Windows media binaries and corresponding source
        if: env.REUSE_WINDOWS_MEDIA == 'true'
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'verified-media-tools.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'verified-media-tools'
          $tag = 'stage2-windows-v2.1.0'
          $checksum = 'c46f6cdc7a86e336dfe9bdb00addfd909216fc4a1f030a74dd6e7d07ef9954e2'
          if ($env:REUSE_LAME_MEDIA -eq 'true') {
            $tag = 'stage3-windows-v3.2.1'
            $checksum = '3bf1a7dd79228ba7288f60a108a79a80e83b5745ec197055fca11843b152cb72'
          }
          curl.exe -fL --retry 3 -o $archive "https://github.com/autogeschichten-dev/MovieReviewStudio/releases/download/$tag/MovieReviewStudio-Windows-x64.zip"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne $checksum) {
            throw 'The prior release archive did not match its verified checksum.'
          }
          Expand-Archive -Path $archive -DestinationPath $extract
          New-Item -ItemType Directory -Path build/ffmpeg -Force | Out-Null
          Copy-Item -Recurse (Join-Path $extract 'MovieReviewStudio/_internal/ffmpeg-bin') build/ffmpeg/bin
          Copy-Item -Recurse (Join-Path $extract 'MovieReviewStudio/FFmpeg-Source') build/ffmpeg/source

      - name: Install pinned application and packaging dependencies
        run: |
          python -m pip install -r requirements.txt PyInstaller==6.12.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check

      - name: Run tests with the bundled media tools
        run: |
          $tools = (Resolve-Path build/ffmpeg/bin).Path
          $env:PATH = "$tools;$env:PATH"
          foreach ($name in 'ffmpeg.exe', 'ffprobe.exe') {
            if ((Get-Command $name).Source -ne (Join-Path $tools $name)) {
              throw "Tests would use a different copy of $name."
            }
          }
          if ($env:RELEASE_TAG -like 'stage3-*' -and ($env:REUSE_WINDOWS_MEDIA -eq 'false' -or $env:REUSE_LAME_MEDIA -eq 'true')) {
            if (!(ffmpeg -hide_banner -encoders | Select-String '\blibmp3lame\b')) {
              throw 'The Windows FFmpeg build is missing the MP3 encoder.'
            }
          }
          python -m unittest discover -s tests -v

      - name: Build and zip the portable application
        run: |
          python -m PyInstaller --noconfirm --onedir --windowed --name MovieReviewStudio `
            --paths . --add-data "build/ffmpeg/bin:ffmpeg-bin" `
            --copy-metadata PySide6 --copy-metadata PySide6-Essentials `
            --copy-metadata PySide6-Addons --copy-metadata shiboken6 `
            --copy-metadata opencv-python-headless --copy-metadata numpy `
            --copy-metadata scenedetect --copy-metadata click `
            --copy-metadata platformdirs --copy-metadata tqdm packaging/windows_entry.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git archive --format=zip -o build/project-source.zip HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Expand-Archive -Path build/project-source.zip -DestinationPath dist/MovieReviewStudio
          if (!(Test-Path dist/MovieReviewStudio/RUN_WINDOWS.bat)) {
            Copy-Item packaging/RUN_WINDOWS.bat dist/MovieReviewStudio
          }
          Copy-Item packaging/README-WINDOWS.txt dist/MovieReviewStudio
          Copy-Item -Recurse build/ffmpeg/source dist/MovieReviewStudio/FFmpeg-Source
          Compress-Archive -Path dist/MovieReviewStudio -DestinationPath $env:ZIP_NAME

      - name: Smoke test the extracted package without Python or FFmpeg on PATH
        run: |
          $smoke = Join-Path $env:RUNNER_TEMP 'Movie Review Studio smoke'
          Expand-Archive -Path $env:ZIP_NAME -DestinationPath $smoke
          $app = Join-Path $smoke MovieReviewStudio
          $marker = Join-Path $smoke ready.txt
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $env:QT_QPA_PLATFORM = 'offscreen'
          foreach ($name in 'python.exe', 'ffmpeg.exe', 'ffprobe.exe') {
            if (Get-Command $name -ErrorAction SilentlyContinue) {
              throw "$name is unexpectedly available on PATH."
            }
          }
          if (!(Test-Path (Join-Path $app RUN_WINDOWS.bat))) {
            throw 'The ZIP is missing RUN_WINDOWS.bat.'
          }
          if ($env:RELEASE_TAG -like 'stage3-*' -and !(Test-Path (Join-Path $app RUN_AI_DIAGNOSTIC.bat))) {
            throw 'The ZIP is missing RUN_AI_DIAGNOSTIC.bat.'
          }
          $exe = Join-Path $app MovieReviewStudio.exe
          $process = Start-Process -FilePath $exe -WorkingDirectory $env:RUNNER_TEMP `
            -ArgumentList @('--startup-smoke-test', ('"{0}"' -f $marker)) -PassThru
          if (!$process.WaitForExit(30000)) {
            Stop-Process -Id $process.Id -Force
            $log = Join-Path $env:LOCALAPPDATA 'Movie Review Studio\studio.log'
            if (Test-Path $log) { Get-Content $log -Tail 30 }
            throw 'The frozen app startup timed out.'
          }
          if ($process.ExitCode -ne 0 -or !(Test-Path $marker) -or
              (Get-Content $marker -Raw).Trim() -ne 'Movie Review Studio ready') {
            throw "The packaged editor did not open. Exit code $($process.ExitCode)."
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
      - name: Publish verified ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Movie Review Studio for Windows x64 ($RELEASE_TAG)"
          if [[ "$RELEASE_TAG" == "stage3-windows-v3.1.4" ]]; then
            title="Movie Review Studio V3.1.4 — Anti-Adjacent Protection Update"
          elif [[ "$RELEASE_TAG" == "stage3-windows-v3.1.5" ]]; then
            title="Movie Review Studio V3.1.5 — AI Planning Duration Recovery"
          elif [[ "$RELEASE_TAG" == "stage3-windows-v3.2.1" ]]; then
            title="Movie Review Studio V3.2.1 — Multi-Part Voice-over Manager"
          elif [[ "$RELEASE_TAG" == "stage3-windows-v3.3.0" ]]; then
            title="Movie Review Studio V3.3.0 — Adaptive Duration and Timeline Editing"
          elif [[ "$RELEASE_TAG" == "stage3-windows-v3.3.1" ]]; then
            title="Movie Review Studio V3.3.1 — Planning Recovery Hotfix"
          elif [[ "$RELEASE_TAG" == "stage3-windows-v3.3.2" ]]; then
            title="Movie Review Studio V3.3.2 — Narration-First Synchronization"
          elif [[ "$RELEASE_TAG" == "stage3-windows-v3.4.1" ]]; then
            title="Movie Review Studio V3.4.1 — Strict Global Fragment Validation"
          elif [[ "$RELEASE_TAG" == "stage3-windows-v3.4.2" ]]; then
            title="Movie Review Studio V3.4.2 — Original Audio Restoration and Adaptive Export"
          fi
          gh release create "$RELEASE_TAG" "$ZIP_NAME" \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$title" \
            --notes "Extract the ZIP and double-click RUN_WINDOWS.bat or MovieReviewStudio.exe. Keep the extracted folder together."
